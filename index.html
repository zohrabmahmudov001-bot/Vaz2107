{const p=[],u=[],ix=[];for(let i=0;i<=N;i++){const c=Math.cos(ch[i]),s=Math.sin(ch[i]);

dm.position.set(t.x-Math.cos(t.h)*d,-hh*.25,t.z+Math.sin(t.h)*d);dm.scale.set(r,hh,r);dm.rotation.y=Math.random()*3;dm.updateMatrix();mt.setMatrixAt(i,dm.matrix);
